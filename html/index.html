<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>PHARAOH</title>
</head>

<body>
    <section class="clips">

            <img src="../image/2k17_era.png" alt="">
        </div>

        <div class="clips__all">

            <div class="clips__info clip-first">
                <div class="clips__youtube">
                    <iframe width="540" height="338" src="https://www.youtube.com/embed/XALLZHKnS_U?si=YXNuVJfza7YhIz-Y"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                </div>

                <p class="author">PHARAOH, Boulevard Depo</p>
            </div>

            <div class="clips__info clip-two">
                <div class="clips__youtube">
                    <iframe width="540" height="338" src="https://www.youtube.com/embed/jWDwdYSdM64?si=J0FSiEKUUWgHJ5dR"

                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                </div>
                <p>Black Siemens</p>
                <p class="author">PHARAOH</p>
            </div>

        </div>

        <div class="clips__next">
            <a href="#">
                <img src="../image/polygon-left.png" alt="">
            </a>
            <p>1 из 1</p>
            <a href="#">
                <img src="../image/polygon-right.png" alt="">

        <footer>
            <div class="footer__info">
                <div class="footer__contacts">
                    <p>Наши контакты</p>
                    <div class="contacts__links">
                        <div class="contact__link">
                            <a href="#">VK</a>
                        </div>
                        <div class="contact__link">
                            <a href="#">Mail</a>
                        </div>
                        <div class="contact__link">
                            <a href="#">Telegram</a>
                        </div>
                    </div>
                </div>
                <div class="footer__quote">
                    <p>“Я Вечно побеждаю, все враги<br>хотят рыдать”, — PHARAOH</p>
                </div>
            </div>
            <div class="footer__copyright">
                <p>2026, Все права защищены</p>
            </div>
        </footer>
    </section>

</html>
