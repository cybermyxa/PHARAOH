<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>PHARAOH</title>
</head>

<body>
    <section class="about">
        <div class="about__inner">
            <span class="about__background-word" aria-hidden="true">PHARAOH</span>
            <img class="about__portrait" src="../image/pharaoh.png" alt="">

            <div class="about__content">
                <div class="about__title">
                    <p class="title__who">КТО ТАКОЙ</p>
                    <p class="title__pharaoh">PHARAOH?</p>
                    <p class="title__subtitle">ОТ ТЕСНЫХ КЛУБОВ ДО СТАДИОНОВ</p>
                </div>

                <div class="about__copy">
                    <p>PHARAOH — сценическое имя Глеба Голубина, российского рэп-исполнителя и продюсера.</p>

                    <p>Он стал заметной фигурой новой волны русского хип-хопаи одним из основателей объединения Dead
                        Dynasty.</p>
                </div>

                <div class="about__ddynasty">
                    <span class="about__ddynasty-mark" aria-hidden="true">✳</span>
                    <p class="about__legacy-name">DEAD DYNASTY</p>
                    <p class="about__legacy-years">2014 — ∞</p>
                </div>
            </div>
        </div>

    </section>
